<!DOCTYPE html>
<html>
<head>
    <title>Login - WS Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            /* Using min-height and 100dvh prevents issues with mobile URL bars */
            min-height: 100vh; min-height: 100dvh; 
            overflow: hidden;
            background: linear-gradient(-45deg, #4158D0, #C850C0, #FFCC70, #4158D0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            color: #fff; 
            margin-bottom: 30px; 
            font-size: 28px; 
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .input-group {
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInRight 0.6s ease forwards;
        }
        .input-group:nth-child(1) { animation-delay: 0.2s; }
        .input-group:nth-child(2) { animation-delay: 0.4s; }

        @keyframes fadeInRight {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        input { 
            width: 100%; padding: 15px 20px; 
            background: rgba(255, 255, 255, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            border-radius: 30px; 
            font-size: 15px; color: #333;
            outline: none; transition: 0.3s;
        }
        input::placeholder { color: #666; font-weight: 500;}
        input:focus { 
            background: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            transform: scale(1.02);
        }

        button { 
            width: 100%; padding: 15px; 
            background: linear-gradient(135deg, #00a884, #008f6f); 
            color: white; border: none; border-radius: 30px; 
            font-size: 16px; font-weight: bold; cursor: pointer; 
            transition: 0.3s; box-shadow: 0 8px 20px rgba(0, 168, 132, 0.4);
            margin-top: 10px;
            opacity: 0;
            animation: fadeInRight 0.6s ease forwards;
            animation-delay: 0.6s;
        }
        button:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 12px 25px rgba(0, 168, 132, 0.6);
        }

        .link { 
            margin-top: 25px; display: block; 
            color: #fff; text-decoration: none; 
            font-size: 14px; font-weight: 600;
            transition: 0.3s;
            opacity: 0;
            animation: fadeInRight 0.6s ease forwards;
            animation-delay: 0.8s;
        }
        .link:hover { color: #FFCC70; text-shadow: 0 0 10px rgba(255, 204, 112, 0.8); }

        /* ==========================================
           📱 MOBILE OPTIMIZATION
           ========================================== */
        @media (max-width: 480px) {
            .auth-box {
                padding: 30px 20px; /* Less padding to give inputs more room */
                width: 95%;
                border-radius: 20px;
            }
            h2 {
                font-size: 24px;
                margin-bottom: 25px;
            }
            input {
                padding: 14px 18px;
                font-size: 16px !important; /* Forces 16px to prevent iOS auto-zoom bug */
            }
            button {
                padding: 14px;
                font-size: 15px;
            }
            .link {
                font-size: 13px;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Welcome Back</h2>
        <form method="POST" action="/login">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <a href="/register" class="link">Don't have an account? Register here.</a>
    </div>
</body>
</html>
